# pythonpath = . ensures `import electrodomestics_bot` works when running
# pytest from the project root without needing PYTHONPATH=. in the shell.
#
# We skip a full pyproject.toml / pip-installable package setup because this
# project is a self-contained backend service, not a library. It is deployed
# as a containerized API that a frontend calls over HTTP — nothing ever does
# `pip install electrodomestics-bot`. The added complexity of a full packaging
# suite would buy nothing for this use case.

[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
